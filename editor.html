<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HORAMI · Local Editor</title><link rel="stylesheet" href="styles.css"><script src="editor.js" defer></script></head><body><main class="studio"><a href="index.html">← サイトへ</a><h1>HORAMI 編集室</h1><p class="notice">編集内容はこのブラウザー内だけに保存されます。「JSONを書き出す」で保存し、GitHubの data/reviews.json を置き換えると公開サイトへ反映されます。この画面を他の人が開いても、あなたのGitHubや公開データを書き換えることはできません。</p><div class="actions"><button id="add">＋ 新規作品</button><button id="save">ブラウザーに下書き保存</button><button id="download">JSONを書き出す</button></div><label>JSONを読み込む（現在の一覧を置換）<input type="file" id="import" accept=".json"></label><label>作品名で絞り込み<input id="search"></label><label>作品を選ぶ<select id="titles"></select></label><p id="status" role="status"></p><form id="fields" class="field-grid"></form></main></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HORAMI · Editorial Studio</title><link rel="stylesheet" href="styles.css?v=luxe1"><script src="editor.js?v=luxe1" defer></script></head><body class="editor-page"><header><a class="brand" href="index.html"><span class="brand-icon">h.</span> HORAMI <b>CINEMA</b></a><a href="index.html">サイトを見る ↗</a></header><main class="studio"><div class="studio-heading"><div><span class="eyebrow">YOUR PERSONAL EDITORIAL STUDIO</span><h1>言葉と余韻を、整える。</h1><p>HORAMI 編集室 · 日英のレビューを、ひとつの場所で。</p></div></div><div class="studio-grid"><aside class="studio-panel"><img id="preview-cover" class="preview-cover" alt="選択した作品の表紙"><h2 id="preview-title" class="preview-title"></h2><div id="preview-rating" class="preview-rating"></div><label>作品を探す<input id="search" placeholder="作品名を入力"></label><label>編集する作品<select id="titles"></select></label><button id="add">＋ 新規レビュー</button><details><summary>ファイルから読み込む</summary><label class="import-label">最新の reviews.json を選択<input type="file" id="import" accept=".json"></label></details></aside><section class="workspace"><div class="studio-tabs" role="group" aria-label="編集する項目"><button type="button" data-tab="basic" class="active">基本情報</button><button type="button" data-tab="review">あらすじ・感想</button><button type="button" data-tab="extras">出演者・豆知識</button><button type="button" data-tab="links">画像・リンク</button></div><p id="status" role="status"></p><form id="fields" class="field-grid"></form><div class="workspace-foot"><div class="actions"><button id="save">下書きを保存</button><button id="download" class="primary">公開用JSONをダウンロード ↗</button></div><p class="notice">下書きはこのブラウザー内に保存されます。公開するには、ダウンロードしたファイルで GitHub の data/reviews.json を置き換えて Commit → Push origin。この画面から公開サイトを直接書き換えることはありません。</p></div></section></div></main></body></html>

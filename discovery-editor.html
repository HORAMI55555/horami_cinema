<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discovery Studio | HORAMI CINEMA</title><link rel="stylesheet" href="styles.css"><script src="discovery-editor.js" defer></script></head><body><main class="review-page"><a href="editor.html">← Editorial Studio</a><h1>Discovery Studio</h1><p>配信先とテーマの編集。日本の配信ページを確認してから確認日を入力。30日を過ぎたサービスはサイト上で非表示になり、最新情報の検索リンクに切り替わります。</p><label>作品 <select id="title"></select></label><p id="status" role="status"></p><form id="form"><label>確認日 <input id="date" type="date"></label><p>配信先：1行に サービス名 | https://作品の公式URL</p><textarea id="services" rows="5" style="width:100%" placeholder="Netflix | https://www.netflix.com/jp/title/..."></textarea><p>テーマ</p><div id="tags" class="chips"></div><button type="submit" class="primary">この作品を下書き保存</button></form><hr><label>discovery.jsonを読み込む <input id="import" type="file" accept=".json"></label><button id="export" class="secondary">discovery.jsonを書き出す</button><p class="fine">書き出したファイルで data/discovery.json を置き換え、GitHubへPushしてください。下書き保存だけでは公開されません。</p></main></body></html>

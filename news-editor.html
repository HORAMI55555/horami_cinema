<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News Studio · HORAMI CINEMA</title><link rel="stylesheet" href="styles.css?v=news14"><script src="news-editor.js?v=update20" defer></script><link rel="stylesheet" href="rating-vod-polish.css?v=update20"></head><body class="editor-page"><header><a class="brand" href="index.html">👻 HORAMI CINEMA</a><nav class="editor-nav"><a href="editor.html">レビュー編集</a><a href="coming-soon.html">ニュースを見る ↗</a></nav></header><main class="studio news-studio"><div class="studio-heading"><h1>News Studio</h1><p>これから観たい作品を、日本語と英語で。</p></div><section class="workspace"><label>記事を選択<select id="news-list"></select></label><div class="actions"><button id="add">＋ 新しい記事</button><button id="save">下書きを保存</button><button id="export" class="primary">news.js?v=update20on をダウンロード ↗</button></div><p id="status" role="status"></p><form id="news-fields" class="field-grid"><label>見出し（日本語）<input name="titleJa"></label><label>Headline (English)<input name="titleEn"></label><label>分類<select name="category"><option value="horror">ホラー・スリラー</option><option value="general">全般</option><option value="series">シリーズ</option></select></label><label>情報を確認した日<input type="date" name="updatedAt"></label><label>公開・配信予定（地域も明記）<input name="releaseJa" placeholder="例：2027年春／日本公開"></label><label>Release information (include region)<input name="releaseEn" placeholder="e.g. Spring 2027 / Japan"></label><label>本文（日本語）<textarea name="bodyJa"></textarea></label><label>Article (English)<textarea name="bodyEn"></textarea></label><label class="wide">公式発表のURL<input name="sourceUrl" type="url" placeholder="https://"></label><label>表示設定<select name="published"><option value="false">下書き（公開ページに表示しない）</option><option value="true">公開（JSON反映後に表示）</option></select></label><label>画像のパス／URL<input name="imageUrl" placeholder="assets/poster.jpg"></label><label>公開日<input type="date" name="releaseDate"></label><label>メインカード<select name="featured"><option value="false">通常</option><option value="true">注目作</option></select></label><label>公開・配信<select name="releaseType"><option value="cinema">劇場公開</option><option value="streaming">配信作品</option></select></label></form><div class="workspace-foot"><label>既存の news.js?v=update20on を読み込む<input type="file" id="import" accept=".json"></label><p class="notice">下書きはこのブラウザーに保存されます。公開時はダウンロードした news.js?v=update20on を GitHub の data/news.js?v=update20on に上書きし、Commit → Push origin。公開記事には日本語・英語の見出しと本文、確認日、公式URLが必要です。</p><button id="delete">選択中の記事を削除</button></div></section></main></body></html>
